<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#D4A27F"/>
  <!-- Claude Desktop sparkle/starburst icon -->
  <g transform="translate(16,16)">
    <!-- Main vertical ray -->
    <ellipse cx="0" cy="0" rx="1.3" ry="7.5" fill="white"/>
    <!-- Main horizontal ray -->
    <ellipse cx="0" cy="0" rx="7.5" ry="1.3" fill="white"/>
    <!-- Diagonal ray top-right to bottom-left -->
    <ellipse cx="0" cy="0" rx="1.1" ry="6" fill="white" transform="rotate(45)"/>
    <!-- Diagonal ray top-left to bottom-right -->
    <ellipse cx="0" cy="0" rx="1.1" ry="6" fill="white" transform="rotate(-45)"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="2.2" fill="white"/>
  </g>
</svg>
